<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" role="img" aria-label="Santosh Kamal - Full-Stack and Backend Developer, AI / ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.55" stop-color="#3d59a1"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
    .sub{font:400 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6e9f5}
    .fade{animation:fade 1.4s ease-out both}
    .fade2{animation:fade 1.4s .5s ease-out both}
    .w1{animation:drift 9s ease-in-out infinite alternate}
    .w2{animation:drift 13s ease-in-out infinite alternate-reverse}
    @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <path class="w1" fill="#ffffff" fill-opacity=".10" d="M0 190 C200 140 400 240 600 190 S1000 140 1320 200 V260 H0Z"/>
    <path class="w2" fill="#ffffff" fill-opacity=".16" d="M0 215 C220 255 420 175 640 215 S1040 250 1320 205 V260 H0Z"/>
    <text class="name fade" x="600" y="115" text-anchor="middle">Santosh Kamal</text>
    <text class="sub fade2" x="600" y="160" text-anchor="middle">Full-Stack &amp; Backend Developer · AI / ML · LLM &amp; RAG</text>
  </g>
</svg>
